
spring.application.name=TrainReservation

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trainreservation_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:https://trainreservation.local}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Fare = class base fare + journey distance (km) * configured rate; rounded HALF_UP to 2 decimals.
app.fare.per-kilometre-rate=${FARE_PER_KM_RATE:1.00}

# Refund quote = 80% of total fare for cancellations before the source departure; no refund is processed automatically.
app.cancellation.refund-percentage=${CANCELLATION_REFUND_PERCENTAGE:0.80}

# Server Configuration
server.port=8080
